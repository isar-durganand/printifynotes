<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Apple Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0066D6" />
    </linearGradient>

    <!-- Top Specular Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop shadow for inner paper -->
    <filter id="docShadow" x="-15%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#002b66" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- iOS Continuous Squircle (Curved App Icon Base) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Specular Top Rim -->
  <rect x="4" y="4" width="504" height="252" rx="112" fill="url(#glossGrad)" />

  <!-- Centered Document Icon -->
  <g filter="url(#docShadow)">
    <!-- Main Paper Body with Folded Top-Right Corner -->
    <path
      d="M 170 114
         L 288 114
         L 348 174
         L 348 388
         A 22 22 0 0 1 326 410
         L 170 410
         A 22 22 0 0 1 148 388
         L 148 136
         A 22 22 0 0 1 170 114 Z"
      fill="#FFFFFF"
    />

    <!-- Folded Corner Flap -->
    <path
      d="M 288 114
         L 288 164
         A 10 10 0 0 0 298 174
         L 348 174 Z"
      fill="#E5E5EA"
    />
    <path
      d="M 288 114
         L 288 164
         A 10 10 0 0 0 298 174
         L 348 174 Z"
      fill="url(#bgGrad)"
      opacity="0.15"
    />

    <!-- Header Accent Bar (Primary Blue) -->
    <rect x="188" y="214" width="136" height="18" rx="9" fill="#007AFF" />

    <!-- Text / Note Lines -->
    <rect x="188" y="254" width="136" height="14" rx="7" fill="#8E8E93" opacity="0.6" />
    <rect x="188" y="288" width="112" height="14" rx="7" fill="#8E8E93" opacity="0.6" />
    <rect x="188" y="322" width="84" height="14" rx="7" fill="#8E8E93" opacity="0.6" />

    <!-- Green Success / Print-Ready Check Badge -->
    <circle cx="308" cy="354" r="18" fill="#34C759" />
    <path
      d="M 302 354 L 306.5 358.5 L 314 349.5"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>
